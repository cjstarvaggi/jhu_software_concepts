name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: GradCafe
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d GradCafe"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r module_4/requirements.txt
          pip install pytest pytest-cov
          pip install llama-cpp-python

      - name: Initialize database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/GradCafe
          DATA_FILE: ${{ github.workspace }}/module_4/src/llm_extend_applicant_data.json
          PYTHONPATH: ${{ github.workspace }}/module_4:${{ github.workspace }}/module_4/src
        run: |
          python module_4/src/load_data.py

      - name: Run test suite
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/GradCafe
          PYTHONPATH: ${{ github.workspace }}/module_4:${{ github.workspace }}/module_4/src
        run: |
          pytest -m "web or buttons or analysis or db or integration" --cov=module_4/src
