name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: GradCafe
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d GradCafe"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            graphviz \
            build-essential \
            cmake \
            ninja-build

      - name: Install Python dependencies
        working-directory: module_5
        run: |
          python -m pip install --upgrade pip
          grep -v '^\./vendor/llama-cpp-python$' requirements.txt > requirements-ci.txt
          python -m pip install --no-cache-dir -r requirements-ci.txt

      - name: Build Linux llama-cpp-python
        env:
          CMAKE_ARGS: "-DGGML_NATIVE=OFF"
        run: |
          python -m pip install --no-cache-dir llama-cpp-python==0.3.35

      - name: Apply patched llama-cpp Python code
        working-directory: module_5
        run: |
          LLAMA_DIR="$(python -c 'import llama_cpp; print(llama_cpp.__path__[0])')"

          find vendor/llama-cpp-python/llama_cpp \
            -type f \
            -name '*.py' \
            -not -path '*/__pycache__/*' \
            -exec cp {} "$LLAMA_DIR/" \;

          rm -rf "$LLAMA_DIR/server"
          cp -r vendor/llama-cpp-python/llama_cpp/server "$LLAMA_DIR/"

      - name: Verify llama-cpp security patch and native library
        working-directory: module_5
        run: |
          LLAMA_DIR="$(python -c 'import llama_cpp; print(llama_cpp.__path__[0])')"

          echo "Installed llama_cpp: $LLAMA_DIR"

          if grep -Rni --include='*.py' '\bpickle\b' "$LLAMA_DIR"; then
            echo "ERROR: pickle found in installed llama-cpp-python"
            exit 1
          fi

          python -c "from llama_cpp import Llama; print('llama_cpp native library loaded successfully')"

      - name: Run Pylint
        working-directory: module_5
        run: |
          python -m pylint src --fail-under=10

      - name: Generate dependency graph
        working-directory: module_5
        run: |
          python -m pydeps src \
            --noshow \
            -T svg \
            -o dependency.svg

          test -f dependency.svg

      - name: Install Snyk
        run: |
          npm install -g snyk

      - name: Run Snyk
        working-directory: module_5
        run: |
          snyk test || true

      - name: Initialize database
        working-directory: module_5
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/GradCafe
          DATA_FILE: ${{ github.workspace }}/module_5/src/llm_extend_applicant_data.json
          PYTHONPATH: ${{ github.workspace }}/module_5:${{ github.workspace }}/module_5/src
        run: |
          python src/load_data.py

      - name: Run Pytest with 100% coverage
        working-directory: module_5
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/GradCafe
          DATA_FILE: ${{ github.workspace }}/module_5/src/llm_extend_applicant_data.json
          PYTHONPATH: ${{ github.workspace }}/module_5:${{ github.workspace }}/module_5/src
        run: |
          python -m pytest \
            -m "web or buttons or analysis or db or integration" \
            --cov=src \
            --cov-fail-under=100
