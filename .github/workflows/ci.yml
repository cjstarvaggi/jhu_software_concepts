name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: GradCafe
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d GradCafe"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            graphviz \
            build-essential \
            cmake \
            ninja-build

      - name: Install Python dependencies
        working-directory: module_5
        run: |
          python -m pip install --upgrade pip

          grep -v '^\./vendor/llama-cpp-python$' \
            requirements.txt > requirements-ci.txt

          python -m pip install \
            --no-cache-dir \
            -r requirements-ci.txt

          python -m pip install \
            --no-cache-dir \
            "numpy>=1.20.0" \
            "typing-extensions>=4.5.0" \
            "jinja2>=2.11.3"

      - name: Build Linux llama native wheel
        env:
          CMAKE_ARGS: "-DGGML_NATIVE=OFF"
        run: |
          rm -rf /tmp/llama-wheel
          mkdir -p /tmp/llama-wheel

          python -m pip wheel \
            --no-cache-dir \
            --no-deps \
            --wheel-dir /tmp/llama-wheel \
            llama-cpp-python==0.3.35

      - name: Install patched llama-cpp Python package
        working-directory: module_5
        run: |
          python -m pip install \
            --no-cache-dir \
            --no-deps \
            ./vendor/llama-cpp-python

      - name: Install Linux llama native libraries
        working-directory: module_5
        run: |
          LLAMA_DIR="$(python - <<'PY'
          import os
          import sysconfig

          print(
              os.path.join(
                  sysconfig.get_paths()["purelib"],
                  "llama_cpp",
              )
          )
          PY
          )"

          LLAMA_LIB_DIR="$LLAMA_DIR/lib"

          echo "LLAMA_DIR=$LLAMA_DIR"
          echo "LLAMA_LIB_DIR=$LLAMA_LIB_DIR"

          test -d "$LLAMA_DIR"

          python - "$LLAMA_LIB_DIR" <<'PY'
          import glob
          import os
          import sys
          import zipfile

          target = sys.argv[1]

          wheels = glob.glob(
              "/tmp/llama-wheel/llama_cpp_python-0.3.35-*.whl"
          )

          if len(wheels) != 1:
              raise SystemExit(
                  f"Expected exactly one llama-cpp wheel, found: {wheels}"
              )

          wheel = wheels[0]

          print(f"Using wheel: {wheel}")

          os.makedirs(target, exist_ok=True)

          with zipfile.ZipFile(wheel) as archive:
              members = [
                  name
                  for name in archive.namelist()
                  if name.startswith("llama_cpp/lib/")
                  and ".so" in os.path.basename(name)
              ]

              if not members:
                  raise SystemExit(
                      "No Linux shared libraries found in llama-cpp wheel"
                  )

              for name in members:
                  destination = os.path.join(
                      target,
                      os.path.basename(name),
                  )

                  with archive.open(name) as source:
                      with open(destination, "wb") as dest:
                          dest.write(source.read())

                  print(f"Installed {destination}")
          PY

          echo "Installed llama libraries:"
          ls -lah "$LLAMA_LIB_DIR"

          test -f "$LLAMA_LIB_DIR/libllama.so"
          test -f "$LLAMA_LIB_DIR/libggml.so.0"

          echo "$LLAMA_LIB_DIR" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$LLAMA_LIB_DIR:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Verify llama installation
        working-directory: module_5
        run: |
          LLAMA_DIR="$(python - <<'PY'
          import os
          import sysconfig

          print(
              os.path.join(
                  sysconfig.get_paths()["purelib"],
                  "llama_cpp",
              )
          )
          PY
          )"

          export LD_LIBRARY_PATH="$LLAMA_DIR/lib:${LD_LIBRARY_PATH:-}"

          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH"

          if python -m pip show diskcache >/dev/null 2>&1; then
            echo "ERROR: diskcache must not be installed"
            exit 1
          fi

          if grep -Rni --include='*.py' '\bpickle\b' "$LLAMA_DIR"; then
            echo "ERROR: pickle reference found in installed llama_cpp package"
            exit 1
          fi

          echo "Checking native library dependencies:"
          ldd "$LLAMA_DIR/lib/libllama.so"

          python -c "import numpy; print('numpy:', numpy.__version__)"

          python -c \
            "from llama_cpp import Llama; print('llama_cpp import successful')"

      - name: Run Pylint
        working-directory: module_5
        run: |
          python -m pylint src --fail-under=10

      - name: Generate dependency graph
        working-directory: module_5
        run: |
          python -m pydeps src \
            --noshow \
            -T svg \
            -o dependency.svg

          test -f dependency.svg

      - name: Install Snyk CLI
        run: |
          npm install -g snyk

      - name: Run Snyk on application dependencies
        working-directory: module_5
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk test \
            --file=requirements-ci.txt \
            --package-manager=pip

      - name: Run Snyk on patched llama-cpp package
        working-directory: module_5
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk test \
            --file=vendor/llama-cpp-python/setup.py \
            --package-manager=pip

      - name: Initialize database
        working-directory: module_5
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/GradCafe
          DATA_FILE: ${{ github.workspace }}/module_5/src/llm_extend_applicant_data.json
          PYTHONPATH: ${{ github.workspace }}/module_5:${{ github.workspace }}/module_5/src
        run: |
          python src/load_data.py

      - name: Run pytest with 100% coverage requirement
        working-directory: module_5
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/GradCafe
          DATA_FILE: ${{ github.workspace }}/module_5/src/llm_extend_applicant_data.json
          PYTHONPATH: ${{ github.workspace }}/module_5:${{ github.workspace }}/module_5/src
        run: |
          python -m pytest \
            -m "web or buttons or analysis or db or integration" \
            --cov=src \
            --cov-fail-under=100
