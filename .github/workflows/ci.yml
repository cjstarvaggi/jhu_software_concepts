name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: GradCafe
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d GradCafe"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Install dependencies
        working-directory: module_5
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # 1. Pylint
      - name: Run Pylint
        working-directory: module_5
        run: |
          python -m pylint src --fail-under=10

      # 2. pydeps + Graphviz
      - name: Generate dependency graph
        working-directory: module_5
        run: |
          python -m pydeps src \
            --noshow \
            --output=dependency.svg
          test -f dependency.svg

      # 3. Snyk
      - name: Install Snyk
        run: |
          npm install -g snyk

      - name: Run Snyk
        working-directory: module_5
        run: |
          snyk test || true

      # Initialize database
      - name: Initialize database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/GradCafe
          DATA_FILE: ${{ github.workspace }}/module_5/src/llm_extend_applicant_data.json
          PYTHONPATH: ${{ github.workspace }}/module_5:${{ github.workspace }}/module_5/src
        working-directory: module_5
        run: |
          python src/load_data.py

      # 4. Pytest + 100% coverage
      - name: Run Pytest
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/GradCafe
          DATA_FILE: ${{ github.workspace }}/module_5/src/llm_extend_applicant_data.json
          PYTHONPATH: ${{ github.workspace }}/module_5:${{ github.workspace }}/module_5/src
        working-directory: module_5
        run: |
          python -m pytest \
            -m "web or buttons or analysis or db or integration" \
            --cov=src \
            --cov-fail-under=100
